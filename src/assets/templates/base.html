[[ define "base" ]]
<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Go Report Card | Go project code quality report cards</title>
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('goreportcard-theme');
        } catch (error) {}
        var preference = theme === 'dark' || theme === 'light' ? 'user' : 'system';
        if (preference === 'system') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-theme-preference', preference);
      })();
    </script>
    <link rel="stylesheet" href="/assets/bulma.0.0.23.min.css">
    <link rel="stylesheet" href="/assets/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/goreportcard.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=[[ .google_analytics_key ]]"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '[[ .google_analytics_key ]]');
    </script>
    <style>
    .header .is-active {
        font-weight: bold;
    }
    </style>
</head>
<body>
<div id="notifications" aria-live="polite" aria-atomic="true">
</div>
    <header class="header">
    <div class="container">
          <!-- Left side -->
          <div class="header-left">
            <a class="header-item" href="/">
              <h3 class="title">Go Report Card</h3>
            </a>
          </div>

          <!-- Hamburger menu (on mobile) -->
          <span class="header-toggle" data-target="header-menu">
            <span></span>
            <span></span>
            <span></span>
          </span>

          <!-- Right side -->
          <div class="header-right header-menu" id="header-menu">
            <span class="header-item">
              <a href="/high_scores">High Scores</a>
            </span>
            <span class="header-item">
              <a href="https://github.com/lbenicio/goreportcard">GitHub</a>
            </span>
            <span class="header-item">
              <a href="/about">About</a>
            </span>
            <span class="header-item">
              <button class="button is-light theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
                <span class="icon"><i class="fa fa-moon-o" aria-hidden="true"></i></span>
                <span class="theme-label">Dark mode</span>
              </button>
            </span>
          </div>
        </div>
    </header>

[[ template "content" . ]]

<footer class="footer">
  <div class="container">
    <div class="content has-text-centered">
      <p><strong>Go Report Card</strong> is maintained by <a href="https://github.com/lbenicio">lbenicio</a>.</p>
    </div>
  </div>
</footer>

<script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js" integrity="sha256-ZSnrWNaPzGe8v25yP0S6YaMaDLMTDHC+4mHTw0xydEk=" crossorigin="anonymous"></script>
<script src="/assets/theme.js" defer></script>
<script>
  $(function () {
    // Get all "header-toggle" elements
    var $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.header-toggle'), 0);
    // Check if there are any navbar burgers
    if ($navbarBurgers.length > 0) {
      // Add a click event on each of them
      $navbarBurgers.forEach(function ($el) {
        $el.addEventListener('click', function () {
          // Get the target from the "data-target" attribute
          var target = $el.dataset.target;
          var $target = document.getElementById(target);
          // Toggle the class on both the "header-toggle" and the "header-menu"
          $el.classList.toggle('is-active');
          $target.classList.toggle('is-active');

        });
      });
    }
  })
</script>

</body>
</html>
[[ end ]]
