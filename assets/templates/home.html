[[ define "content" ]]
  <section class="hero is-primary is-medium has-text-centered gopher">
    <div class="hero-content">
      <div class="container">
        <h2 class="subtitle">
          Enter the <strong>go get</strong> path to the project below:
        </h2>
        <form method="POST" action="/checks" id="check_form">
          <div>
            <p class="url">
              <input name="repo" type="text" class="input-box" placeholder="github.com/lbenicio/goreportcard"/>
            </p>
          </div>
          <div>
            <button type="submit" class="button btn-test is-large" href="#" role="button">Generate Report</button>
          </div>
        </form>
      </div>
    </div>
  </section>
  <section class="section container-suggestions">
      <div class="container">
          <div class="columns">
              <div class="column">
                  <table class="table is-fullwidth">
                    <thead>
                      <tr>
                        <th>Recently Generated</th>
                      </tr>
                    </thead>
                    <tbody id="recent-repositories">
                        [[ range .Recent ]]
                        <tr>
                            <td class="table-link"><a href="/report/[[ . ]]">[[ . ]]</a></td>
                        </tr>
                        [[ end ]]
                    </tbody>
                  </table>
              </div>
          </div>
      </div>
  </section>

  <section class="section container-results hidden">
    <div class="container">
        <div class="columns results-text">
        </div>
        <div class="columns">
          <div class="column is-quarter">
            <nav class="menu results">
            </nav>
            <div class="container-update">
            </div>
          </div>
          <div class="column">
              <div class="results-details">
              </div>
          </div>
        </div>
    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js" integrity="sha256-ZSnrWNaPzGe8v25yP0S6YaMaDLMTDHC+4mHTw0xydEk=" crossorigin="anonymous"></script>
  <script id="template-alert" type="text/x-handlebars-template">
      <div class="notification" role="status" aria-live="polite">
          <button class="delete"></button>
          <span class="notification-message">{{message}}</span>
      </div>
  </script>
  <script type="text/javascript">
    // initialize handlebars templates
    var templates = {};
    $("script[id^=template]").each(function(){
      var name = $(this).attr("id").substring(9);
      var source   = $(this).html();
      templates[name] = Handlebars.compile(source);
    });

    var activeSubmission = false;
    var toastTimer;

    function alertMessage(msg, type, reportURL){
      var html = templates.alert({message: msg});
      var $alert = $(html);
      $alert.addClass(type || "is-warning");
      if (type === "is-danger") {
          $alert.attr("role", "alert").attr("aria-live", "assertive");
      }
      $alert.find(".delete").on("click", function(){
          $(this).closest(".notification").remove();
      });
      $("#notifications").children().remove();
      $alert.hide();
      if (reportURL) {
          $("<a>", {"class": "notification-link", href: reportURL, text: "View report"}).appendTo($alert);
      }
      $alert.appendTo("#notifications");
      $alert.slideDown();
      window.clearTimeout(toastTimer);
      if (type === "is-success") {
          toastTimer = window.setTimeout(function(){ $alert.slideUp(200, function(){ $alert.remove(); }); }, 8000);
      }
    }

    function updateToastMessage(msg){
      var $message = $("#notifications .notification-message");
      if ($message.length) {
          $message.text(msg);
      } else {
          alertMessage(msg, "is-info");
      }
    }

    function finishSubmission(){
      activeSubmission = false;
      $("#check_form .button").removeClass("is-loading").prop("disabled", false);
    }

    function addRecentReport(repo, reportURL){
      var $recent = $("#recent-repositories");
      $recent.find("a").filter(function(){ return $(this).text() === repo; }).closest("tr").remove();
      var $link = $("<a>", {href: reportURL, text: repo});
      var $row = $("<tr>").append($("<td>").addClass("table-link").append($link));
      $recent.prepend($row);
      $recent.children("tr").slice(5).remove();
    }

    function pollReport(repo){
      $.ajax({
        type: "GET",
        url: "/checks",
        data: {repo: repo, refresh: 1},
        dataType: "json"
      }).done(function(data){
        if (data.pending) {
          updateToastMessage("Generating report for " + repo + "…");
          window.setTimeout(function(){ pollReport(repo); }, data.retry_after_ms || 2000);
          return;
        }
        if (!data.report || !data.redirect) {
          finishSubmission();
          alertMessage("The report request finished without a report. Please try again.", "is-warning");
          return;
        }
        $("#check_form input[name=repo]").val("");
        addRecentReport(data.report.repo, data.redirect);
        finishSubmission();
        alertMessage("Report generated for " + data.report.repo, "is-success", data.redirect);
      }).fail(function(xhr){
        finishSubmission();
        alertMessage("There was an error processing your request: " + xhr.responseText, "is-danger");
      });
    }

    var loadData = function(){
      if (activeSubmission) {
        return false;
      }
      var $form = $(this),
          repo = $.trim($form.find("input[name=repo]").val());

      if (!repo) {
        alertMessage("Input cannot be empty. Please enter a valid repository path", "is-warning");
        return false;
      }

      activeSubmission = true;
      $("#check_form .button").addClass("is-loading").prop("disabled", true);
      alertMessage("Submitting " + repo + " for analysis…", "is-info");
      $.ajax({
        type: $form.attr("method"),
        url: $form.attr("action"),
        data: {repo: repo},
        dataType: "json"
      }).done(function(data){
        if (!data.redirect) {
          finishSubmission();
          alertMessage("The report request could not be started. Please try again.", "is-warning");
          return;
        }
        pollReport(repo);
      }).fail(function(xhr){
        finishSubmission();
        alertMessage("There was an error processing your request: " + xhr.responseText, "is-danger");
      });
      return false;
    };

    // on ready
    $(function(){
      // handle form submission
      $("form#check_form").submit(loadData);
    });
  </script>
[[ end ]]
