name: Static analysis and unit testing

on: [push, pull_request]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'

    - name: Install
      run: make install

    - name: Lint
      run: make lint

    - name: Test
      run: go test ./...
