name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          echo "::error::Release workflow must be run from main."
          exit 1

  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_info.outputs.version }}
      release_notes_b64: ${{ steps.release_info.outputs.release_notes_b64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read latest changelog release
        id: release_info
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text()
          heading = re.search(r"(?m)^## \[(\d+\.\d+\.\d+)\][^\n]*$", changelog)
          if heading is None:
              raise SystemExit("CHANGELOG.md has no SemVer release heading")

          next_heading = re.search(r"(?m)^## \[", changelog[heading.end():])
          body_end = heading.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[heading.end():body_end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md release {heading.group(1)} has no release notes")

          notes_b64 = base64.b64encode(notes.encode()).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={heading.group(1)}\n")
              output.write(f"release_notes_b64={notes_b64}\n")
          PY

      - name: Fail if the version is already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.release_info.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "::error::Git tag ${version} already exists."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check remote tag ${version}."
              exit "$status"
            fi
          fi

          response_file="$RUNNER_TEMP/release-check.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${version}")"
          if [[ "$status" == "200" ]]; then
            echo "::error::GitHub release ${version} already exists."
            exit 1
          elif [[ "$status" != "404" ]]; then
            cat "$response_file" >&2
            echo "::error::Could not check GitHub release ${version} (HTTP ${status})."
            exit 1
          fi

  build:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKER_USER }}/goreportcard
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native architecture image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}/goreportcard
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USER }}/goreportcard
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        shell: bash
        run: |
          set -euo pipefail

          host_arch="$(uname -m)"
          case "${ARCH}:${host_arch}" in
            amd64:x86_64|arm64:aarch64) ;;
            *)
              echo "::error::Expected ${ARCH} runner, got host architecture ${host_arch}."
              exit 1
              ;;
          esac

          build_args=()
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then
              build_args+=(--label "$label")
            fi
          done <<< "$DOCKER_LABELS"

          ghcr_tag="${GHCR_IMAGE}:${VERSION}-${ARCH}"
          docker_tag="${DOCKER_IMAGE}:${VERSION}-${ARCH}"
          docker build --pull --platform "$PLATFORM" \
            --tag "$ghcr_tag" \
            --tag "$docker_tag" \
            "${build_args[@]}" \
            .

          built_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ghcr_tag")"
          if [[ "$built_platform" != "$PLATFORM" ]]; then
            echo "::error::Expected ${PLATFORM} image, built ${built_platform}."
            exit 1
          fi

          docker push "$ghcr_tag"
          docker push "$docker_tag"

  publish:
    needs:
      - prepare
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Buildx for manifest assembly
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}/goreportcard
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USER }}/goreportcard
        shell: bash
        run: |
          set -euo pipefail

          for image in "$GHCR_IMAGE" "$DOCKER_IMAGE"; do
            docker buildx imagetools create \
              --tag "${image}:${VERSION}" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"
          done

      - name: Create GitHub release from changelog
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_B64: ${{ needs.prepare.outputs.release_notes_b64 }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          notes = base64.b64decode(os.environ["RELEASE_NOTES_B64"], validate=True)
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_bytes(notes)
          PY

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
