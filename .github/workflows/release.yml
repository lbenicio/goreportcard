name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          echo "::error::Release workflow must be run from main."
          exit 1

  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_info.outputs.version }}
      release_notes_b64: ${{ steps.release_info.outputs.release_notes_b64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read latest changelog release
        id: release_info
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text()
          heading = re.search(r"(?m)^## \[(\d+\.\d+\.\d+)\][^\n]*$", changelog)
          if heading is None:
              raise SystemExit("CHANGELOG.md has no SemVer release heading")

          next_heading = re.search(r"(?m)^## \[", changelog[heading.end():])
          body_end = heading.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[heading.end():body_end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md release {heading.group(1)} has no release notes")

          notes_b64 = base64.b64encode(notes.encode()).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={heading.group(1)}\n")
              output.write(f"release_notes_b64={notes_b64}\n")
          PY

      - name: Fail if the version is already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.release_info.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "::error::Git tag ${version} already exists."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check remote tag ${version}."
              exit "$status"
            fi
          fi

          response_file="$RUNNER_TEMP/release-check.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${version}")"
          if [[ "$status" == "200" ]]; then
            echo "::error::GitHub release ${version} already exists."
            exit 1
          elif [[ "$status" != "404" ]]; then
            cat "$response_file" >&2
            echo "::error::Could not check GitHub release ${version} (HTTP ${status})."
            exit 1
          fi

  build:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKER_USER }}/goreportcard
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native architecture image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USER }}/goreportcard
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        shell: bash
        run: |
          set -euo pipefail

          host_arch="$(uname -m)"
          case "${ARCH}:${host_arch}" in
            amd64:x86_64|arm64:aarch64) ;;
            *)
              echo "::error::Expected ${ARCH} runner, got host architecture ${host_arch}."
              exit 1
              ;;
          esac

          build_args=()
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then
              build_args+=(--label "$label")
            fi
          done <<< "$DOCKER_LABELS"

          ghcr_tag="${GHCR_IMAGE}:${VERSION}-${ARCH}"
          docker_tag="${DOCKER_IMAGE}:${VERSION}-${ARCH}"
          docker build --pull --platform "$PLATFORM" \
            --tag "$ghcr_tag" \
            --tag "$docker_tag" \
            "${build_args[@]}" \
            .

          built_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ghcr_tag")"
          if [[ "$built_platform" != "$PLATFORM" ]]; then
            echo "::error::Expected ${PLATFORM} image, built ${built_platform}."
            exit 1
          fi

          docker push "$ghcr_tag"
          docker push "$docker_tag"

  publish:
    needs:
      - prepare
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    outputs:
      manifests_published: ${{ steps.publish_images.outputs.published }}
      release_created: ${{ steps.create_release.outputs.created }}
    steps:
      - name: Set up Buildx for manifest assembly
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        id: publish_images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USER }}/goreportcard
        shell: bash
        run: |
          set -euo pipefail

          for image in "$GHCR_IMAGE" "$DOCKER_IMAGE"; do
            docker buildx imagetools create \
              --tag "${image}:${VERSION}" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"
            docker buildx imagetools create --tag "${image}:latest" "${image}:${VERSION}-amd64" "${image}:${VERSION}-arm64"
          done
          printf 'published=true\n' >> "$GITHUB_OUTPUT"

      - name: Create GitHub release from changelog
        id: create_release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_B64: ${{ needs.prepare.outputs.release_notes_b64 }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          notes = base64.b64decode(os.environ["RELEASE_NOTES_B64"], validate=True)
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_bytes(notes)
          PY

          gh release create "$VERSION" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
          printf 'created=true\n' >> "$GITHUB_OUTPUT"

  summary:
    if: always()
    needs:
      - reject-non-main
      - prepare
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write workflow run summary
        shell: bash
        env:
          BRANCH_GATE_RESULT: ${{ needs.reject-non-main.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          MANIFESTS_PUBLISHED: ${{ needs.publish.outputs.manifests_published }}
          RELEASE_CREATED: ${{ needs.publish.outputs.release_created }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES_B64: ${{ needs.prepare.outputs.release_notes_b64 }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USER }}/goreportcard
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          status_mark() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              cancelled) printf '🛑 Cancelled' ;;
              skipped) printf '⏭️ Skipped' ;;
              *) printf '⚪ Not run' ;;
            esac
          }

          branch_gate="$(status_mark "$BRANCH_GATE_RESULT")"
          if [[ "$BRANCH_GATE_RESULT" == "skipped" && "$REF_NAME" == "main" ]]; then
            branch_gate="✅ Main branch selected (non-main guard skipped)"
          fi

          if [[ "$MANIFESTS_PUBLISHED" == "true" && "$RELEASE_CREATED" == "true" ]]; then
            title="## ✅ Release workflow completed"
          else
            title="## ❌ Release workflow did not complete"
          fi

          {
            printf '%s\n\n' "$title"
            if [[ -n "$VERSION" ]]; then
              printf '**Version:** \x60v%s\x60\n\n' "$VERSION"
            else
              printf '**Version:** Not determined (prepare job %s)\n\n' "$PREPARE_RESULT"
            fi

            printf '| Stage | Result |\n|---|---|\n'
            printf '| Branch gate | %s |\n' "$branch_gate"
            printf '| Prepare | %s |\n' "$(status_mark "$PREPARE_RESULT")"
            printf '| Native amd64/arm64 builds | %s |\n' "$(status_mark "$BUILD_RESULT")"
            if [[ "$MANIFESTS_PUBLISHED" == "true" ]]; then
              manifest_status='✅ Published'
            else
              manifest_status="$(status_mark "$PUBLISH_RESULT")"
            fi
            if [[ "$RELEASE_CREATED" == "true" ]]; then
              release_status='✅ Created'
            else
              release_status="$(status_mark "$PUBLISH_RESULT")"
            fi
            printf '| Multi-platform image tags | %s |\n' "$manifest_status"
            printf '| GitHub release | %s |\n\n' "$release_status"

            if [[ "$RELEASE_CREATED" == "true" && -n "$VERSION" ]]; then
              printf '**GitHub release:** [v%s](%s/%s/releases/tag/%s)\n\n' \
                "$VERSION" "$SERVER_URL" "$REPOSITORY" "$VERSION"
            fi

            printf '### Container images\n\n'
            if [[ "$MANIFESTS_PUBLISHED" == "true" && -n "$VERSION" ]]; then
              printf -- '- GHCR: \x60%s:%s\x60 and \x60%s:latest\x60\n' "$GHCR_IMAGE" "$VERSION" "$GHCR_IMAGE"
              printf -- '- Docker Hub: \x60%s:%s\x60 and \x60%s:latest\x60\n' "$DOCKER_IMAGE" "$VERSION" "$DOCKER_IMAGE"
              printf -- '- Platforms: \x60linux/amd64\x60, \x60linux/arm64\x60\n\n'
            elif [[ "$BUILD_RESULT" == "success" && -n "$VERSION" ]]; then
              printf 'Native architecture builds completed, but multi-platform tags were not confirmed. Check the publish job logs.\n\n'
            else
              printf 'Images were not published successfully. Check the build and publish job logs.\n\n'
            fi

            if [[ -n "$RELEASE_NOTES_B64" ]]; then
              printf '### Changelog notes\n\n'
              printf '%s' "$RELEASE_NOTES_B64" | base64 --decode
              printf '\n\n'
            fi

            printf '### Run details\n\n'
            printf -- '- **Branch:** \x60%s\x60\n' "$REF_NAME"
            printf -- '- **Commit:** [\x60%s\x60](%s/%s/commit/%s)\n' "${COMMIT_SHA:0:7}" "$SERVER_URL" "$REPOSITORY" "$COMMIT_SHA"
            printf -- '- **Triggered by:** \x60%s\x60\n' "$ACTOR"
            printf -- '- [View workflow run](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
