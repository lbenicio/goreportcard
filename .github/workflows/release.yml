name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          echo "::error::Release workflow must be run from main."
          exit 1

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read latest changelog release
        id: release_info
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text()
          heading = re.search(r"(?m)^## \[(\d+\.\d+\.\d+)\][^\n]*$", changelog)
          if heading is None:
              raise SystemExit("CHANGELOG.md has no SemVer release heading")

          next_heading = re.search(r"(?m)^## \[", changelog[heading.end():])
          body_end = heading.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[heading.end():body_end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md release {heading.group(1)} has no release notes")

          notes_path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          notes_path.write_text(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={heading.group(1)}\n")
              output.write(f"notes_path={notes_path}\n")
          PY

      - name: Fail if the version is already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.release_info.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "::error::Git tag ${version} already exists."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check remote tag ${version}."
              exit "$status"
            fi
          fi

          response_file="$RUNNER_TEMP/release-check.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${version}")"
          if [[ "$status" == "200" ]]; then
            echo "::error::GitHub release ${version} already exists."
            exit 1
          elif [[ "$status" != "404" ]]; then
            cat "$response_file" >&2
            echo "::error::Could not check GitHub release ${version} (HTTP ${status})."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release_info.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
            ${{ secrets.DOCKER_USER }}/goreportcard:${{ steps.release_info.outputs.version }}
            ${{ secrets.DOCKER_USER }}/goreportcard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_info.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.release_info.outputs.version }}" \
            --notes-file "${{ steps.release_info.outputs.notes_path }}"
